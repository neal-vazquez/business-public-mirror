<text x="60" y="65" font-family="Arial,sans-serif" font-size="30" font-weight="700" fill="#202630">JORDAN ELLIS</text>
<text x="60" y="106.4" font-family="Arial,sans-serif" font-size="19" font-weight="700" fill="#111c3b">Nurse Manager · Medical-Surgical</text>
<text x="60" y="132.62" font-family="Arial,sans-serif" font-size="15" font-weight="400" fill="#202630">Columbus, OH | jordan.ellis@example.com</text>
<text x="60" y="167.32" font-family="Arial,sans-serif" font-size="14" font-weight="700" fill="#111c3b">PROFESSIONAL SUMMARY</text>
<path d="M60 176.64 H756" stroke="#bcc2cc"/>
<text x="60" y="196.64" font-family="Arial,sans-serif" font-size="16" font-weight="400" fill="#202630">Nurse leader with 17 years across bedside care, shift leadership, and unit</text>
<text x="60" y="218.71999999999997" font-family="Arial,sans-serif" font-size="16" font-weight="400" fill="#202630">operations. Manages a 24-bed medical-surgical unit and 32 nursing staff, with a</text>
<text x="60" y="240.79999999999995" font-family="Arial,sans-serif" font-size="16" font-weight="400" fill="#202630">focus on staffing, development, and clear patient transitions.</text>
<text x="60" y="276.87999999999994" font-family="Arial,sans-serif" font-size="14" font-weight="700" fill="#111c3b">EXPERIENCE</text>
<path d="M60 286.19999999999993 H756" stroke="#bcc2cc"/>
<text x="60" y="306.19999999999993" font-family="Arial,sans-serif" font-size="15" font-weight="700" fill="#202630">Nurse Manager | Meadow Hospital | 2020–present</text>
<text x="60" y="334.8999999999999" font-family="Arial,sans-serif" font-size="16" font-weight="400" fill="#202630">• Manage staffing, scheduling, and performance development for 32 nursing staff on</text>
<text x="60" y="356.9799999999999" font-family="Arial,sans-serif" font-size="16" font-weight="400" fill="#202630">a 24-bed medical-surgical unit.</text>
<text x="60" y="388.0599999999999" font-family="Arial,sans-serif" font-size="16" font-weight="400" fill="#202630">• Co-developed a discharge teach-back checklist adopted across the unit to</text>
<text x="60" y="410.1399999999999" font-family="Arial,sans-serif" font-size="16" font-weight="400" fill="#202630">standardize medication and follow-up instructions.</text>
<text x="60" y="441.21999999999986" font-family="Arial,sans-serif" font-size="16" font-weight="400" fill="#202630">• Built a structured preceptor assignment process and coached charge nurses on</text>
<text x="60" y="463.29999999999984" font-family="Arial,sans-serif" font-size="16" font-weight="400" fill="#202630">escalation and shift handoffs.</text>
<text x="60" y="494.3799999999998" font-family="Arial,sans-serif" font-size="16" font-weight="400" fill="#202630">• Coordinate competency reviews, orientation progress and interdisciplinary care-</text>
<text x="60" y="516.4599999999998" font-family="Arial,sans-serif" font-size="16" font-weight="400" fill="#202630">transition discussions; support staff through incident debriefs and workflow</text>
<text x="60" y="538.5399999999998" font-family="Arial,sans-serif" font-size="16" font-weight="400" fill="#202630">changes.</text>
<text x="60" y="578.6199999999999" font-family="Arial,sans-serif" font-size="15" font-weight="700" fill="#202630">Charge Nurse | Meadow Hospital | 2015–2020</text>
<text x="60" y="607.3199999999999" font-family="Arial,sans-serif" font-size="16" font-weight="400" fill="#202630">Coordinated shift assignments and escalation while caring for 4–5 patients per</text>
<text x="60" y="629.4" font-family="Arial,sans-serif" font-size="16" font-weight="400" fill="#202630">shift; precepted 6 new nurses on unit workflows and Epic. Managed admissions,</text>
<text x="60" y="651.48" font-family="Arial,sans-serif" font-size="16" font-weight="400" fill="#202630">transfers and float-staff orientation alongside patient care; maintained</text>
<text x="60" y="673.5600000000001" font-family="Arial,sans-serif" font-size="16" font-weight="400" fill="#202630">continuity through bedside handoffs.</text>
<text x="60" y="707.6400000000001" font-family="Arial,sans-serif" font-size="15" font-weight="700" fill="#202630">Registered Nurse | Lakeview Care Center | 2009–2015</text>
<text x="60" y="734.3400000000001" font-family="Arial,sans-serif" font-size="16" font-weight="400" fill="#202630">Delivered post-acute care and coordinated daily care goals with rehabilitation</text>
<text x="60" y="756.4200000000002" font-family="Arial,sans-serif" font-size="16" font-weight="400" fill="#202630">staff and families. Supported care-planning discussions and prepared patients and</text>
<text x="60" y="778.5000000000002" font-family="Arial,sans-serif" font-size="16" font-weight="400" fill="#202630">families for transitions home.</text>
<text x="60" y="814.5800000000003" font-family="Arial,sans-serif" font-size="14" font-weight="700" fill="#111c3b">SKILLS &amp; CREDENTIALS</text>
<path d="M60 823.9000000000003 H756" stroke="#bcc2cc"/>
<text x="60" y="843.9000000000003" font-family="Arial,sans-serif" font-size="16" font-weight="400" fill="#202630">Ohio RN license (active); BLS; Epic; patient education; discharge coordination</text>
<text x="60" y="879.9800000000004" font-family="Arial,sans-serif" font-size="14" font-weight="700" fill="#111c3b">EDUCATION</text>
<path d="M60 889.3000000000004 H756" stroke="#bcc2cc"/>
<text x="60" y="909.3000000000004" font-family="Arial,sans-serif" font-size="14" font-weight="400" fill="#202630">M.S. Nursing Leadership | North Valley University | 2018</text>
<text x="60" y="928.6200000000005" font-family="Arial,sans-serif" font-size="14" font-weight="400" fill="#202630">B.S. Nursing | North Valley University | 2009</text>
