<svg xmlns="http://www.w3.org/2000/svg" width="816" height="1056" viewBox="0 0 816 1056">
<rect width="816" height="1056" fill="white"/>
<text x="60" y="65" font-family="Arial,sans-serif" font-size="30" font-weight="700" fill="#202630">CASEY CHEN</text>
<text x="60" y="106.4" font-family="Arial,sans-serif" font-size="19" font-weight="700" fill="#111c3b">Financial Controller</text>
<text x="60" y="132.62" font-family="Arial,sans-serif" font-size="15" font-weight="400" fill="#202630">Chicago, IL | casey.chen@example.com</text>
<text x="60" y="167.32" font-family="Arial,sans-serif" font-size="14" font-weight="700" fill="#111c3b">PROFESSIONAL SUMMARY</text>
<path d="M60 176.64 H756" stroke="#bcc2cc"/>
<text x="60" y="196.64" font-family="Arial,sans-serif" font-size="16" font-weight="400" fill="#202630">Controller and CPA with 18 years in accounting and financial operations. Leads a</text>
<text x="60" y="218.71999999999997" font-family="Arial,sans-serif" font-size="16" font-weight="400" fill="#202630">6-person team across 3 entities, connecting accurate reporting, disciplined</text>
<text x="60" y="240.79999999999995" font-family="Arial,sans-serif" font-size="16" font-weight="400" fill="#202630">controls, and an efficient month-end close.</text>
<text x="60" y="276.87999999999994" font-family="Arial,sans-serif" font-size="14" font-weight="700" fill="#111c3b">EXPERIENCE</text>
<path d="M60 286.19999999999993 H756" stroke="#bcc2cc"/>
<text x="60" y="306.19999999999993" font-family="Arial,sans-serif" font-size="15" font-weight="700" fill="#202630">Financial Controller | Summit Components Inc. | 2020–present</text>
<text x="60" y="334.8999999999999" font-family="Arial,sans-serif" font-size="16" font-weight="400" fill="#202630">• Lead a 6-person accounting team responsible for reporting, reconciliations, and</text>
<text x="60" y="356.9799999999999" font-family="Arial,sans-serif" font-size="16" font-weight="400" fill="#202630">close activities across 3 entities.</text>
<text x="60" y="388.0599999999999" font-family="Arial,sans-serif" font-size="16" font-weight="400" fill="#202630">• Standardized supporting schedules and review handoffs; the team’s close cycle</text>
<text x="60" y="410.1399999999999" font-family="Arial,sans-serif" font-size="16" font-weight="400" fill="#202630">moved from 10 to 7 business days.</text>
<text x="60" y="441.21999999999986" font-family="Arial,sans-serif" font-size="16" font-weight="400" fill="#202630">• Coordinate external-audit schedules and internal review owners, delivering</text>
<text x="60" y="463.29999999999984" font-family="Arial,sans-serif" font-size="16" font-weight="400" fill="#202630">assigned requests by agreed deadlines.</text>
<text x="60" y="494.3799999999998" font-family="Arial,sans-serif" font-size="16" font-weight="400" fill="#202630">• Translate ledger variances into management reporting; partner with operations on</text>
<text x="60" y="516.4599999999998" font-family="Arial,sans-serif" font-size="16" font-weight="400" fill="#202630">inventory entries and supporting controls.</text>
<text x="60" y="556.5399999999998" font-family="Arial,sans-serif" font-size="15" font-weight="700" fill="#202630">Senior Accountant | Summit Components Inc. | 2013–2020</text>
<text x="60" y="585.2399999999999" font-family="Arial,sans-serif" font-size="16" font-weight="400" fill="#202630">Owned 35 monthly balance-sheet reconciliations, investigated discrepancies, and</text>
<text x="60" y="607.3199999999999" font-family="Arial,sans-serif" font-size="16" font-weight="400" fill="#202630">documented resolutions before sign-off. Prepared variance explanations and</text>
<text x="60" y="629.4" font-family="Arial,sans-serif" font-size="16" font-weight="400" fill="#202630">maintained review documentation for management and external auditors. Supported</text>
<text x="60" y="651.48" font-family="Arial,sans-serif" font-size="16" font-weight="400" fill="#202630">inventory accounting with operations.</text>
<text x="60" y="685.5600000000001" font-family="Arial,sans-serif" font-size="15" font-weight="700" fill="#202630">Accounting Associate | River Services Co. | 2008–2013</text>
<text x="60" y="712.2600000000001" font-family="Arial,sans-serif" font-size="16" font-weight="400" fill="#202630">Managed vendor-invoice support and resolved purchase-order discrepancies before</text>
<text x="60" y="734.3400000000001" font-family="Arial,sans-serif" font-size="16" font-weight="400" fill="#202630">payment runs. Maintained transaction records and supporting schedules, escalating</text>
<text x="60" y="756.4200000000002" font-family="Arial,sans-serif" font-size="16" font-weight="400" fill="#202630">exceptions for review before month-end.</text>
<text x="60" y="792.5000000000002" font-family="Arial,sans-serif" font-size="14" font-weight="700" fill="#111c3b">SKILLS &amp; CREDENTIALS</text>
<path d="M60 801.8200000000003 H756" stroke="#bcc2cc"/>
<text x="60" y="821.8200000000003" font-family="Arial,sans-serif" font-size="16" font-weight="400" fill="#202630">CPA; U.S. GAAP; NetSuite; multi-entity reporting; close management; internal</text>
<text x="60" y="843.9000000000003" font-family="Arial,sans-serif" font-size="16" font-weight="400" fill="#202630">controls; audit coordination</text>
<text x="60" y="879.9800000000004" font-family="Arial,sans-serif" font-size="14" font-weight="700" fill="#111c3b">EDUCATION</text>
<path d="M60 889.3000000000004 H756" stroke="#bcc2cc"/>
<text x="60" y="909.3000000000004" font-family="Arial,sans-serif" font-size="14" font-weight="400" fill="#202630">M.S. Accounting | Prairie State University | 2012</text>
<text x="60" y="928.6200000000005" font-family="Arial,sans-serif" font-size="14" font-weight="400" fill="#202630">B.S. Accounting | Prairie State University | 2008</text>
<text x="60" y="947.9400000000005" font-family="Arial,sans-serif" font-size="14" font-weight="400" fill="#202630">CPA, Illinois (active)</text>
