<svg xmlns="http://www.w3.org/2000/svg" width="816" height="1056" viewBox="0 0 816 1056">
<rect width="816" height="1056" fill="white"/>
<text x="60" y="65" font-family="Arial,sans-serif" font-size="30" font-weight="700" fill="#202630">JAMIE BROOKS</text>
<text x="60" y="106.4" font-family="Arial,sans-serif" font-size="19" font-weight="700" fill="#111c3b">Learning &amp; Development · Leadership Transition</text>
<text x="60" y="132.62" font-family="Arial,sans-serif" font-size="15" font-weight="400" fill="#202630">Raleigh, NC | jamie.brooks@example.com</text>
<text x="60" y="167.32" font-family="Arial,sans-serif" font-size="14" font-weight="700" fill="#111c3b">PROFESSIONAL SUMMARY</text>
<path d="M60 176.64 H756" stroke="#bcc2cc"/>
<text x="60" y="196.64" font-family="Arial,sans-serif" font-size="16" font-weight="400" fill="#202630">Education leader moving into organizational learning after 18 years in teaching,</text>
<text x="60" y="218.71999999999997" font-family="Arial,sans-serif" font-size="16" font-weight="400" fill="#202630">curriculum design, and staff development. Leads curriculum work across 4 schools</text>
<text x="60" y="240.79999999999995" font-family="Arial,sans-serif" font-size="16" font-weight="400" fill="#202630">and translates complex material into usable learning experiences.</text>
<text x="60" y="276.87999999999994" font-family="Arial,sans-serif" font-size="14" font-weight="700" fill="#111c3b">EXPERIENCE</text>
<path d="M60 286.19999999999993 H756" stroke="#bcc2cc"/>
<text x="60" y="306.19999999999993" font-family="Arial,sans-serif" font-size="15" font-weight="700" fill="#202630">Director of Curriculum | Oak Grove Schools | 2020–present</text>
<text x="60" y="334.8999999999999" font-family="Arial,sans-serif" font-size="16" font-weight="400" fill="#202630">• Coordinate curriculum implementation across 4 schools, aligning school leaders</text>
<text x="60" y="356.9799999999999" font-family="Arial,sans-serif" font-size="16" font-weight="400" fill="#202630">and instructional teams on learning goals and materials.</text>
<text x="60" y="388.0599999999999" font-family="Arial,sans-serif" font-size="16" font-weight="400" fill="#202630">• Designed a 6-module onboarding sequence for 12 new teachers, combining</text>
<text x="60" y="410.1399999999999" font-family="Arial,sans-serif" font-size="16" font-weight="400" fill="#202630">facilitation, reference guides, and practice activities.</text>
<text x="60" y="441.21999999999986" font-family="Arial,sans-serif" font-size="16" font-weight="400" fill="#202630">• Led 8 staff workshops on assessment design and revised materials using</text>
<text x="60" y="463.29999999999984" font-family="Arial,sans-serif" font-size="16" font-weight="400" fill="#202630">participant feedback.</text>
<text x="60" y="494.3799999999998" font-family="Arial,sans-serif" font-size="16" font-weight="400" fill="#202630">• Translate participant feedback into revised learning resources and help</text>
<text x="60" y="516.4599999999998" font-family="Arial,sans-serif" font-size="16" font-weight="400" fill="#202630">instructional teams adapt materials for accessibility.</text>
<text x="60" y="556.5399999999998" font-family="Arial,sans-serif" font-size="15" font-weight="700" fill="#202630">Teacher &amp; Grade-Level Lead | Oak Grove School | 2013–2020</text>
<text x="60" y="585.2399999999999" font-family="Arial,sans-serif" font-size="16" font-weight="400" fill="#202630">Built accessible Canvas materials with captions, clear navigation, and knowledge</text>
<text x="60" y="607.3199999999999" font-family="Arial,sans-serif" font-size="16" font-weight="400" fill="#202630">checks for 90 learners; supported grade-level planning. Supported new teachers</text>
<text x="60" y="629.4" font-family="Arial,sans-serif" font-size="16" font-weight="400" fill="#202630">with planning resources and facilitated grade-level discussions about assessment</text>
<text x="60" y="651.48" font-family="Arial,sans-serif" font-size="16" font-weight="400" fill="#202630">and learning needs.</text>
<text x="60" y="685.5600000000001" font-family="Arial,sans-serif" font-size="15" font-weight="700" fill="#202630">Classroom Teacher | Maple Creek School | 2008–2013</text>
<text x="60" y="712.2600000000001" font-family="Arial,sans-serif" font-size="16" font-weight="400" fill="#202630">Designed standards-aligned instruction, adapted lessons using assessment results,</text>
<text x="60" y="734.3400000000001" font-family="Arial,sans-serif" font-size="16" font-weight="400" fill="#202630">and communicated progress to families. Worked with colleagues to review teaching</text>
<text x="60" y="756.4200000000002" font-family="Arial,sans-serif" font-size="16" font-weight="400" fill="#202630">resources and supported new staff with classroom routines and school procedures.</text>
<text x="60" y="792.5000000000002" font-family="Arial,sans-serif" font-size="14" font-weight="700" fill="#111c3b">SKILLS &amp; CREDENTIALS</text>
<path d="M60 801.8200000000003 H756" stroke="#bcc2cc"/>
<text x="60" y="821.8200000000003" font-family="Arial,sans-serif" font-size="16" font-weight="400" fill="#202630">Learning design, facilitation, assessment, Canvas LMS, accessibility, staff</text>
<text x="60" y="843.9000000000003" font-family="Arial,sans-serif" font-size="16" font-weight="400" fill="#202630">training</text>
<text x="60" y="879.9800000000004" font-family="Arial,sans-serif" font-size="14" font-weight="700" fill="#111c3b">EDUCATION</text>
<path d="M60 889.3000000000004 H756" stroke="#bcc2cc"/>
<text x="60" y="909.3000000000004" font-family="Arial,sans-serif" font-size="14" font-weight="400" fill="#202630">Ed.D. Educational Leadership | Piedmont University | 2020</text>
<text x="60" y="928.6200000000005" font-family="Arial,sans-serif" font-size="14" font-weight="400" fill="#202630">M.Ed. Curriculum &amp; Instruction | Piedmont University | 2013</text>
<text x="60" y="947.9400000000005" font-family="Arial,sans-serif" font-size="14" font-weight="400" fill="#202630">B.A. English | Piedmont University | 2008</text>
