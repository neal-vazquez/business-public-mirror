<text x="60" y="65" font-family="Arial,sans-serif" font-size="30" font-weight="700" fill="#202630">TAYLOR REED</text>
<text x="60" y="106.4" font-family="Arial,sans-serif" font-size="19" font-weight="700" fill="#111c3b">Enterprise Account Executive</text>
<text x="60" y="132.62" font-family="Arial,sans-serif" font-size="15" font-weight="400" fill="#202630">Austin, TX | taylor.reed@example.com</text>
<text x="60" y="167.32" font-family="Arial,sans-serif" font-size="14" font-weight="700" fill="#111c3b">PROFESSIONAL SUMMARY</text>
<path d="M60 176.64 H756" stroke="#bcc2cc"/>
<text x="60" y="196.64" font-family="Arial,sans-serif" font-size="16" font-weight="400" fill="#202630">Enterprise software seller with 16 years of progressive commercial experience.</text>
<text x="60" y="218.71999999999997" font-family="Arial,sans-serif" font-size="16" font-weight="400" fill="#202630">Closed $3.36M in new annual recurring revenue in 2025, reaching 112% of quota</text>
<text x="60" y="240.79999999999995" font-family="Arial,sans-serif" font-size="16" font-weight="400" fill="#202630">through complex discovery, executive alignment, and negotiation.</text>
<text x="60" y="276.87999999999994" font-family="Arial,sans-serif" font-size="14" font-weight="700" fill="#111c3b">EXPERIENCE</text>
<path d="M60 286.19999999999993 H756" stroke="#bcc2cc"/>
<text x="60" y="306.19999999999993" font-family="Arial,sans-serif" font-size="15" font-weight="700" fill="#202630">Enterprise Account Executive | Juniper Software Inc. | 2020–present</text>
<text x="60" y="334.8999999999999" font-family="Arial,sans-serif" font-size="16" font-weight="400" fill="#202630">• Closed $3.36M in new ARR against a $3M quota in 2025, with an average contract</text>
<text x="60" y="356.9799999999999" font-family="Arial,sans-serif" font-size="16" font-weight="400" fill="#202630">value of $280K.</text>
<text x="60" y="388.0599999999999" font-family="Arial,sans-serif" font-size="16" font-weight="400" fill="#202630">• Built multithreaded plans for 30 enterprise accounts, aligning finance,</text>
<text x="60" y="410.1399999999999" font-family="Arial,sans-serif" font-size="16" font-weight="400" fill="#202630">operations, procurement, and technical buyers.</text>
<text x="60" y="441.21999999999986" font-family="Arial,sans-serif" font-size="16" font-weight="400" fill="#202630">• Led discovery and commercial negotiation with solutions engineers and legal</text>
<text x="60" y="463.29999999999984" font-family="Arial,sans-serif" font-size="16" font-weight="400" fill="#202630">partners through 6–12-month sales cycles.</text>
<text x="60" y="494.3799999999998" font-family="Arial,sans-serif" font-size="16" font-weight="400" fill="#202630">• Coordinate security review, pricing approvals and implementation expectations in</text>
<text x="60" y="516.4599999999998" font-family="Arial,sans-serif" font-size="16" font-weight="400" fill="#202630">mutual action plans that keep buyers and delivery teams aligned.</text>
<text x="60" y="556.5399999999998" font-family="Arial,sans-serif" font-size="15" font-weight="700" fill="#202630">Account Executive | Bridge Systems Inc. | 2014–2020</text>
<text x="60" y="585.2399999999999" font-family="Arial,sans-serif" font-size="16" font-weight="400" fill="#202630">Managed a 60-account mid-market territory and maintained structured handoffs from</text>
<text x="60" y="607.3199999999999" font-family="Arial,sans-serif" font-size="16" font-weight="400" fill="#202630">discovery to implementation. Prepared account research and coordinated buyer</text>
<text x="60" y="629.4" font-family="Arial,sans-serif" font-size="16" font-weight="400" fill="#202630">questions across commercial and technical stakeholders. Maintained forecast</text>
<text x="60" y="651.48" font-family="Arial,sans-serif" font-size="16" font-weight="400" fill="#202630">updates and supported implementation planning.</text>
<text x="60" y="685.5600000000001" font-family="Arial,sans-serif" font-size="15" font-weight="700" fill="#202630">Sales Development Representative | Bridge Systems Inc. | 2010–2014</text>
<text x="60" y="712.2600000000001" font-family="Arial,sans-serif" font-size="16" font-weight="400" fill="#202630">Qualified inbound and outbound prospects for 3 account executives; averaged 14</text>
<text x="60" y="734.3400000000001" font-family="Arial,sans-serif" font-size="16" font-weight="400" fill="#202630">sales-accepted meetings per month in the final year. Built prospect research and</text>
<text x="60" y="756.4200000000002" font-family="Arial,sans-serif" font-size="16" font-weight="400" fill="#202630">outreach routines that supported account-executive discovery and territory</text>
<text x="60" y="778.5000000000002" font-family="Arial,sans-serif" font-size="16" font-weight="400" fill="#202630">coverage.</text>
<text x="60" y="814.5800000000003" font-family="Arial,sans-serif" font-size="14" font-weight="700" fill="#111c3b">SKILLS &amp; CREDENTIALS</text>
<path d="M60 823.9000000000003 H756" stroke="#bcc2cc"/>
<text x="60" y="843.9000000000003" font-family="Arial,sans-serif" font-size="16" font-weight="400" fill="#202630">Salesforce, discovery, pipeline management, negotiation, account planning</text>
<text x="60" y="879.9800000000004" font-family="Arial,sans-serif" font-size="14" font-weight="700" fill="#111c3b">EDUCATION</text>
