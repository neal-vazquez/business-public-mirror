<text x="272" y="180" font-family="Arial,serif" font-size="13.44" fill="#174c61" font-weight="700">ABOUT ME</text>
<text x="272" y="203.8592" font-family="Arial,serif" font-size="12.6" fill="#222" font-weight="400">Enterprise software seller with 16 years of progressive commercial</text>
<text x="272" y="218.72719999999998" font-family="Arial,serif" font-size="12.6" fill="#222" font-weight="400">experience. Closed $3.36M in new annual recurring revenue in 2025,</text>
<text x="272" y="233.59519999999998" font-family="Arial,serif" font-size="12.6" fill="#222" font-weight="400">reaching 112% of quota through complex discovery, executive alignment,</text>
<text x="272" y="248.46319999999997" font-family="Arial,serif" font-size="12.6" fill="#222" font-weight="400">and negotiation. Background includes hands-on delivery, collaboration</text>
<text x="272" y="263.33119999999997" font-family="Arial,serif" font-size="12.6" fill="#222" font-weight="400">across departments, reporting, staff support and planning. Interested in</text>
<text x="272" y="278.19919999999996" font-family="Arial,serif" font-size="12.6" fill="#222" font-weight="400">a senior position that builds on this experience and offers the</text>
<text x="272" y="293.06719999999996" font-family="Arial,serif" font-size="12.6" fill="#222" font-weight="400">opportunity to take on broader responsibility.</text>
<text x="272" y="331.93519999999995" font-family="Arial,serif" font-size="14.28" fill="#174c61" font-weight="700">MY EXPERIENCE</text>
<text x="272" y="356.78559999999993" font-family="Arial,serif" font-size="13.44" fill="#222" font-weight="400">Enterprise Account Executive | Juniper Software Inc. | 2020–present</text>
<text x="272" y="380.6447999999999" font-family="Arial,serif" font-size="12.6" fill="#222" font-weight="400">Own the full sales process, including prospecting, discovery,</text>
<text x="272" y="395.8447999999999" font-family="Arial,serif" font-size="12.6" fill="#222" font-weight="400">demonstrations, proposal preparation and contract discussions. Track</text>
<text x="272" y="411.0447999999999" font-family="Arial,serif" font-size="12.6" fill="#222" font-weight="400">opportunities in Salesforce, update forecast calls and work with</text>
<text x="272" y="426.2447999999999" font-family="Arial,serif" font-size="12.6" fill="#222" font-weight="400">implementation colleagues on handoffs. Prepare account research before</text>
<text x="272" y="441.4447999999999" font-family="Arial,serif" font-size="12.6" fill="#222" font-weight="400">meetings and follow up on open commercial and technical questions.</text>
<text x="272" y="456.64479999999986" font-family="Arial,serif" font-size="12.6" fill="#222" font-weight="400">Closed $3.36M in new ARR against a $3M quota in 2025, with an average</text>
<text x="272" y="471.84479999999985" font-family="Arial,serif" font-size="12.6" fill="#222" font-weight="400">contract value of $280K. Maintain account plans and stakeholder maps,</text>
<text x="272" y="487.04479999999984" font-family="Arial,serif" font-size="12.6" fill="#222" font-weight="400">meet with customer contacts, arrange sessions with solutions engineers</text>
<text x="272" y="502.2447999999998" font-family="Arial,serif" font-size="12.6" fill="#222" font-weight="400">and coordinate responses to procurement requirements. Review opportunity</text>
<text x="272" y="517.4447999999999" font-family="Arial,serif" font-size="12.6" fill="#222" font-weight="400">progress with management, identify additional decision makers and keep</text>
<text x="272" y="532.6447999999999" font-family="Arial,serif" font-size="12.6" fill="#222" font-weight="400">the team informed about budget timing and approval requirements. Built</text>
<text x="272" y="547.8448" font-family="Arial,serif" font-size="12.6" fill="#222" font-weight="400">multithreaded plans for 30 enterprise accounts, aligning finance,</text>
<text x="272" y="563.0448" font-family="Arial,serif" font-size="12.6" fill="#222" font-weight="400">operations, procurement, and technical buyers. Coordinate product</text>
<text x="272" y="578.2448" font-family="Arial,serif" font-size="12.6" fill="#222" font-weight="400">demonstrations, security questionnaires, pricing approvals and redlines</text>
<text x="272" y="593.4448000000001" font-family="Arial,serif" font-size="12.6" fill="#222" font-weight="400">with internal partners. Prepare mutual action plans, discuss</text>
<text x="272" y="608.6448000000001" font-family="Arial,serif" font-size="12.6" fill="#222" font-weight="400">implementation expectations with buyers and maintain communication</text>
<text x="272" y="623.8448000000002" font-family="Arial,serif" font-size="12.6" fill="#222" font-weight="400">through extended procurement cycles. Support renewal and expansion</text>
<text x="272" y="639.0448000000002" font-family="Arial,serif" font-size="12.6" fill="#222" font-weight="400">conversations when existing relationships create an opportunity for new</text>
<text x="272" y="654.2448000000003" font-family="Arial,serif" font-size="12.6" fill="#222" font-weight="400">business. Led discovery and commercial negotiation with solutions</text>
<text x="272" y="669.4448000000003" font-family="Arial,serif" font-size="12.6" fill="#222" font-weight="400">engineers and legal partners through 6–12-month sales cycles.</text>
<text x="272" y="700.6448000000004" font-family="Arial,serif" font-size="13.44" fill="#222" font-weight="700">Account Executive | Bridge Systems Inc. | 2014–2020</text>
<text x="272" y="724.5040000000004" font-family="Arial,serif" font-size="12.6" fill="#222" font-weight="400">Managed a 60-account mid-market territory and maintained structured</text>
<text x="272" y="739.3720000000004" font-family="Arial,serif" font-size="12.6" fill="#222" font-weight="400">handoffs from discovery to implementation. Prepared account research and</text>
<text x="272" y="754.2400000000005" font-family="Arial,serif" font-size="12.6" fill="#222" font-weight="400">coordinated buyer questions across commercial and technical</text>
<text x="272" y="769.1080000000005" font-family="Arial,serif" font-size="12.6" fill="#222" font-weight="400">stakeholders. Maintained forecast updates and supported implementation</text>
<text x="272" y="783.9760000000006" font-family="Arial,serif" font-size="12.6" fill="#222" font-weight="400">planning. Maintained supporting documentation, kept team priorities</text>
<text x="272" y="798.8440000000006" font-family="Arial,serif" font-size="12.6" fill="#222" font-weight="400">current and provided updates during regular planning and review</text>
<text x="272" y="813.7120000000007" font-family="Arial,serif" font-size="12.6" fill="#222" font-weight="400">meetings. Worked with colleagues to resolve requests and communicate</text>
<text x="272" y="828.5800000000007" font-family="Arial,serif" font-size="12.6" fill="#222" font-weight="400">outstanding work.</text>
<text x="272" y="855.4480000000008" font-family="Arial,serif" font-size="12.6" fill="#222" font-weight="700">Sales Development Representative | Bridge Systems Inc. | 2010–2014</text>
<text x="272" y="875.3160000000008" font-family="Arial,serif" font-size="11.76" fill="#222" font-weight="400">Qualified inbound and outbound prospects for 3 account executives;</text>
<text x="272" y="889.1928000000008" font-family="Arial,serif" font-size="11.76" fill="#222" font-weight="400">averaged 14 sales-accepted meetings per month in the final year. Built</text>
<text x="272" y="903.0696000000008" font-family="Arial,serif" font-size="11.76" fill="#222" font-weight="400">prospect research and outreach routines that supported account-executive</text>
<text x="272" y="916.9464000000008" font-family="Arial,serif" font-size="11.76" fill="#222" font-weight="400">discovery and territory coverage. Built practical knowledge of the</text>
<text x="272" y="930.8232000000008" font-family="Arial,serif" font-size="11.76" fill="#222" font-weight="400">organization’s systems and procedures, maintained working records and</text>
<text x="272" y="944.7000000000008" font-family="Arial,serif" font-size="11.76" fill="#222" font-weight="400">supported colleagues with daily priorities.</text>
