<text x="24" y="363.2432" font-family="Arial,serif" font-size="11.76" fill="#174c61" font-weight="700">PERSONAL STRENGTHS</text>
<text x="24" y="385.12" font-family="Arial,serif" font-size="10.92" fill="#222" font-weight="400">Negotiation; communication;</text>
<text x="24" y="398.0056" font-family="Arial,serif" font-size="10.92" fill="#222" font-weight="400">business development;</text>
