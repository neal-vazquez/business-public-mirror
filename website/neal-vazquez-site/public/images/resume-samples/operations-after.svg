<svg xmlns="http://www.w3.org/2000/svg" width="816" height="1056" viewBox="0 0 816 1056">
<rect width="816" height="1056" fill="white"/>
<text x="60" y="65" font-family="Arial,sans-serif" font-size="30" font-weight="700" fill="#202630">SAM RIVERA</text>
<text x="60" y="106.4" font-family="Arial,sans-serif" font-size="19" font-weight="700" fill="#111c3b">Director of Distribution Operations</text>
<text x="60" y="132.62" font-family="Arial,sans-serif" font-size="15" font-weight="400" fill="#202630">Phoenix, AZ | sam.rivera@example.com</text>
<text x="60" y="167.32" font-family="Arial,sans-serif" font-size="14" font-weight="700" fill="#111c3b">PROFESSIONAL SUMMARY</text>
<path d="M60 176.64 H756" stroke="#bcc2cc"/>
<text x="60" y="196.64" font-family="Arial,sans-serif" font-size="16" font-weight="400" fill="#202630">Distribution leader with 19 years from frontline fulfillment to operations</text>
<text x="60" y="218.71999999999997" font-family="Arial,sans-serif" font-size="16" font-weight="400" fill="#202630">management. Oversees 3 shifts and 85 staff, combining workload planning, inventory</text>
<text x="60" y="240.79999999999995" font-family="Arial,sans-serif" font-size="16" font-weight="400" fill="#202630">controls, and supervisor development.</text>
<text x="60" y="276.87999999999994" font-family="Arial,sans-serif" font-size="14" font-weight="700" fill="#111c3b">EXPERIENCE</text>
<path d="M60 286.19999999999993 H756" stroke="#bcc2cc"/>
<text x="60" y="306.19999999999993" font-family="Arial,sans-serif" font-size="15" font-weight="700" fill="#202630">Director of Operations | Copper Distribution Co. | 2020–present</text>
<text x="60" y="334.8999999999999" font-family="Arial,sans-serif" font-size="16" font-weight="400" fill="#202630">• Oversee 3 shifts and 85 staff through 6 supervisors, setting daily priorities</text>
<text x="60" y="356.9799999999999" font-family="Arial,sans-serif" font-size="16" font-weight="400" fill="#202630">and reviewing service, accuracy, and capacity.</text>
<text x="60" y="388.0599999999999" font-family="Arial,sans-serif" font-size="16" font-weight="400" fill="#202630">• Introduced a scan-and-verify checkpoint; recorded picking errors fell from 2.1%</text>
<text x="60" y="410.1399999999999" font-family="Arial,sans-serif" font-size="16" font-weight="400" fill="#202630">to 1.2% over the next quarter.</text>
<text x="60" y="441.21999999999986" font-family="Arial,sans-serif" font-size="16" font-weight="400" fill="#202630">• Rebalanced pick zones using order-frequency data, reducing average travel time</text>
<text x="60" y="463.29999999999984" font-family="Arial,sans-serif" font-size="16" font-weight="400" fill="#202630">per sampled pick route by 18%.</text>
<text x="60" y="494.3799999999998" font-family="Arial,sans-serif" font-size="16" font-weight="400" fill="#202630">• Coordinate seasonal capacity, equipment constraints and carrier exceptions with</text>
<text x="60" y="516.4599999999998" font-family="Arial,sans-serif" font-size="16" font-weight="400" fill="#202630">supervisors and customer-service partners.</text>
<text x="60" y="556.5399999999998" font-family="Arial,sans-serif" font-size="15" font-weight="700" fill="#202630">Shift Supervisor | Copper Distribution Co. | 2013–2020</text>
<text x="60" y="585.2399999999999" font-family="Arial,sans-serif" font-size="16" font-weight="400" fill="#202630">Scheduled and coached a 14-person outbound shift handling approximately 1,200</text>
<text x="60" y="607.3199999999999" font-family="Arial,sans-serif" font-size="16" font-weight="400" fill="#202630">orders per day. Coordinated coverage, resolved inventory and shipping exceptions,</text>
<text x="60" y="629.4" font-family="Arial,sans-serif" font-size="16" font-weight="400" fill="#202630">and trained new staff on standard work and scanning procedures.</text>
<text x="60" y="663.48" font-family="Arial,sans-serif" font-size="15" font-weight="700" fill="#202630">Warehouse Associate | Mesa Supply Co. | 2007–2013</text>
<text x="60" y="690.1800000000001" font-family="Arial,sans-serif" font-size="16" font-weight="400" fill="#202630">Handled order picking, receiving discrepancies, and weekly cycle counts before</text>
<text x="60" y="712.2600000000001" font-family="Arial,sans-serif" font-size="16" font-weight="400" fill="#202630">promotion into shift leadership. Reconciled receiving exceptions with colleagues</text>
<text x="60" y="734.3400000000001" font-family="Arial,sans-serif" font-size="16" font-weight="400" fill="#202630">and helped new starters learn warehouse systems and daily routines.</text>
<text x="60" y="770.4200000000002" font-family="Arial,sans-serif" font-size="14" font-weight="700" fill="#111c3b">SKILLS &amp; CREDENTIALS</text>
<path d="M60 779.7400000000002 H756" stroke="#bcc2cc"/>
<text x="60" y="799.7400000000002" font-family="Arial,sans-serif" font-size="16" font-weight="400" fill="#202630">Shift planning, inventory control, cycle counting, WMS, standard work, coaching</text>
<text x="60" y="835.8200000000003" font-family="Arial,sans-serif" font-size="14" font-weight="700" fill="#111c3b">EDUCATION</text>
<path d="M60 845.1400000000003 H756" stroke="#bcc2cc"/>
<text x="60" y="865.1400000000003" font-family="Arial,sans-serif" font-size="14" font-weight="400" fill="#202630">M.B.A. Operations | Desert State University | 2015</text>
<text x="60" y="884.4600000000004" font-family="Arial,sans-serif" font-size="14" font-weight="400" fill="#202630">B.S. Business Administration | Desert State University | 2007</text>
